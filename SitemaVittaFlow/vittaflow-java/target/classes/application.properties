spring.application.name=VittaFlow
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/vittaflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${VITTAFLOW_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
joinfaces.faces.project-stage=Development
joinfaces.faces-servlet.load-on-startup=1
joinfaces.faces-servlet.url-mappings=*.xhtml
joinfaces.primefaces.theme=none
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
