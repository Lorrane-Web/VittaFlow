<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:p="primefaces" xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title>VittaFlow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <h:outputStylesheet library="css" name="style.css" />
</h:head>
<h:body>
    <div class="login">
        <div class="card login-card">
            <div class="brand brand-big">VittaFlow</div>
            <p class="sub">Rotina de saúde e bem-estar.</p>
            <h:form id="login">
                <p:messages />
                <div class="form">
                    <p:outputLabel for="e" value="E-mail" />
                    <p:inputText id="e" value="#{vittaController.emailLogin}" required="true" />
                    <p:outputLabel for="s" value="Senha" />
                    <p:password id="s" value="#{vittaController.senhaLogin}" required="true" />
                    <p:commandButton value="Entrar" action="#{vittaController.login}" ajax="false"
                        icon="pi pi-sign-in" />
                </div>
                <div class="demo"><b>Dados demonstrativos</b><br />Usuário: mariana@vittaflow.com /
                    123456<br />Profissional: ana.nutri@vittaflow.com / 123456</div>
            </h:form>
        
           
           <!--- <div class="footer">MVP acadêmico • H2 temporário • sem integrações externas</div> -->
        </div>
    </div>
</h:body>

</html>
